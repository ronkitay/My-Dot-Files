# Oh-My-Tmux 

set-environment -g tmux_conf_theme_window_bg colour236
set-environment -g tmux_conf_theme_focused_pane_bg black
set-environment -g tmux_conf_theme_highlight_focused_pane true

set-environment -g tmux_conf_theme_pane_border_style single
set-environment -g tmux_conf_theme_pane_border colour240

# Enable Mouse
set -g mouse on

# Terminal settings
set -g default-terminal "tmux-256color"
set -gw xterm-keys on

# Extended keys (CSI-u) — required to distinguish Shift+Enter from Enter
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Start numbering from 1 and not 0

set -g base-index 1
set -g pane-base-index 1

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Pane splits (stay in current dir)
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Windows
bind W confirm-before -p "kill-window #W? (y/n)" kill-window

# Sessions
bind S new-session
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Pane borders
# set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#[bold,fg=cyan] [#{pane_index}] #{pane_title} #[default]"

